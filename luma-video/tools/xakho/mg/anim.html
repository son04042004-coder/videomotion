<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
  /* Motion graphic kiểu C "sticker bựa" (chồng iu chọn 29/10), có chuyển động theo thời gian.
     window.setup({type, dur, data}) rồi window.seek(t) cho từng khung; nền trong suốt để ghép lên video.
     Vùng an toàn TikTok: x 60–940, y 150–1450 (chừa nút bên phải + chú thích phía dưới). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: 'Be Vietnam Pro', sans-serif; }
  .abs { position: absolute; }
  .dim { position: absolute; left: 0; right: 0; top: 392px; height: 1000px; background: #000; opacity: 0; }
  .stk { -webkit-text-stroke: var(--sw, 12px) #111; paint-order: stroke fill; }
  .ylw { color: #ffd400; } .wht { color: #fff; } .red { color: #ff2b2b; }
  .pill { display: inline-block; font-weight: 900; border: 6px solid #111; box-shadow: 9px 9px 0 #111; border-radius: 18px; }
  .card { display: flex; align-items: center; gap: 22px; height: 116px; padding: 0 24px; border: 5px solid #111; box-shadow: 8px 8px 0 #111; border-radius: 22px; background: #fff; }
  .card .ic { width: 70px; height: 70px; border-radius: 16px; display: grid; place-items: center; flex: none; background: #111; }
  .card .ic svg { width: 42px; height: 42px; stroke: #ffd400; }
  .card b { display: block; font-weight: 900; font-size: 40px; line-height: 1.08; color: #111; }
  .card span { display: block; font-weight: 700; font-size: 28px; color: #333; margin-top: 2px; }
  .ok { margin-left: auto; width: 58px; height: 58px; border-radius: 50%; background: #22c55e; border: 4px solid #111; display: grid; place-items: center; flex: none; }
  .ok svg { width: 34px; height: 34px; stroke: #fff; }
  .cmp b { font-size: 34px; } .cmp span { font-size: 24px; } .cmp .ic { width: 58px; height: 58px; } .cmp .ic svg { width: 34px; height: 34px; }
  .cmp .ok { width: 48px; height: 48px; } .cmp .ok svg { width: 28px; height: 28px; }
  .emoji { font-family: 'Segoe UI Emoji'; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 9.2 4.5 4.5 0 0 0 7 18z" fill="none" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  <symbol id="spark" viewBox="0 0 24 24"><path d="M12 2.5c.8 5.2 4.3 8.7 9.5 9.5-5.2.8-8.7 4.3-9.5 9.5-.8-5.2-4.3-8.7-9.5-9.5 5.2-.8 8.7-4.3 9.5-9.5z" fill="none" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5" fill="none" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  <symbol id="film" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2.5" fill="none" stroke-width="2.4"/><path d="M16 10l5-3v10l-5-3z" fill="none" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  <symbol id="code" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke-width="2.4"/><circle cx="8.5" cy="9.5" r="1.8" fill="none" stroke-width="2.2"/><path d="M4 18l5.5-5.5 4 4 2.5-2.5L20 18" fill="none" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke-width="2.4"/><path d="M15.5 15.5L21 21" fill="none" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="none" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke-width="2.4"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5" fill="none" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke-width="2.4"/><path d="M4 21c1.5-4.5 4.5-6.5 8-6.5s6.5 2 8 6.5" fill="none" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke-width="2.4"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z" fill="none" stroke-width="2.4"/></symbol>
  <symbol id="bot" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M11 1.5h2V5h-2zM5 6h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm3.5 4.5a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zm7 0a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zM8 15.5V17h8v-1.5zM.5 10h1.5v6H.5zm22 0H24v6h-1.5z"/></symbol>
  <symbol id="plane" viewBox="0 0 24 24"><path d="M21.4 3.6 2.9 10.8c-1 .4-1 1.8.1 2.1l4.6 1.4 1.8 5.6c.3.9 1.4 1.1 2 .4l2.6-2.7 4.7 3.5c.8.6 1.9.2 2.1-.8l3-15.1c.2-1.1-.9-2-2-1.6zM9.2 14l8.6-7.4-6.9 8.6-.3 3.3z"/></symbol>
</defs></svg>
<div id="root"></div>
<script>
const clamp = (x) => Math.max(0, Math.min(1, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const outBack = (x) => { const c1 = 1.9, c3 = c1 + 1; x = clamp(x); return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inCubic = (x) => Math.pow(clamp(x), 3);
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
const fmt = (v, dec = 0) => v.toLocaleString('vi-VN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
let S = null;

// Lối ra chung: 0,25s cuối thu nhỏ + mờ
function exitK(t) { return 1 - inCubic(lin(t, S.dur - 0.25, S.dur)); }
function setDim(t, max = 0.42) { S.dim.style.opacity = max * outCubic(lin(t, 0, 0.18)) * exitK(t); }

const TYPES = {
  slam: {  // MG1: con số xả kho đập vào màn hình
    build(d) {
      return `<div class="dim"></div>
      <svg class="abs" id="rays" style="left:-110px;top:270px;width:1300px;height:1300px" viewBox="-50 -50 100 100"><g fill="rgba(255,212,0,.35)">
        ${Array.from({ length: 12 }, (_, i) => `<path d="M0 0L-3.2 -50L3.2 -50Z" transform="rotate(${i * 30})"/>`).join('')}</g></svg>
      <div class="abs" id="grp" style="left:60px;width:880px;top:560px;text-align:center">
        <div class="pill red" id="tag" style="background:#fff;font-size:58px;padding:6px 34px">${d.tag}</div>
        <div class="stk wht" id="prod" style="--sw:13px;font-weight:900;font-size:60px;margin-top:22px">${d.prod}</div>
        <div class="stk ylw" id="num" style="--sw:24px;font-weight:900;font-size:${d.num.length >= 4 ? 210 : d.num.length === 3 ? 250 : 300}px;line-height:.95;letter-spacing:-6px;filter:drop-shadow(12px 14px 0 #111)">${d.num}<span style="font-size:140px;letter-spacing:0;margin-left:20px">${d.unit}</span></div>
        <div class="stk wht" id="sub" style="--sw:11px;font-weight:800;font-size:50px;margin-top:10px">${d.sub}</div>
      </div>`;
    },
    seek(t) {
      setDim(t);
      const $ = (id) => document.getElementById(id);
      $('rays').style.transform = `rotate(${t * 22}deg) scale(${outCubic(lin(t, 0.15, 0.5))})`;
      $('rays').style.opacity = exitK(t);
      const tg = outBack(lin(t, 0.02, 0.3));
      $('tag').style.transform = `rotate(${3 - 6 * (1 - tg)}deg) scale(${tg})`;
      const pr = outCubic(lin(t, 0.1, 0.35));
      $('prod').style.transform = `translateX(${-500 * (1 - pr)}px) rotate(-4deg)`; $('prod').style.opacity = pr;
      const n = lin(t, 0.18, 0.42);
      const sc = n < 1 ? 2.4 - 1.5 * outBack(n) : 1;
      const sh = t > 0.42 && t < 0.72 ? Math.sin(t * 90) * 14 * (1 - lin(t, 0.42, 0.72)) : 0;
      $('num').style.transform = `translate(${sh}px, ${sh * 0.6}px) rotate(-5deg) scale(${Math.max(0, sc)})`;
      $('num').style.opacity = clamp(n * 4);
      const sb = outCubic(lin(t, 0.5, 0.75));
      $('sub').style.transform = `translateY(${40 * (1 - sb)}px) rotate(-3deg)`; $('sub').style.opacity = sb;
      const e = exitK(t);
      $('grp').style.transform = `translateY(${-120 * (1 - e)}px) scale(${0.7 + 0.3 * e})`; $('grp').style.opacity = e;
    },
  },
  strike: {  // MG2: giá chính hãng bị gạch + bộ đếm
    build(d) {
      return `<div class="dim"></div>
      <div class="abs" id="grp" style="left:70px;width:860px;top:520px;text-align:center">
        <div class="pill" id="lab" style="background:#fff;color:#111;font-size:48px;padding:6px 30px;transform:rotate(-3deg)">${d.label}</div>
        <div id="valbox" style="position:relative;display:inline-block;margin-top:26px">
          <div class="stk wht" style="--sw:16px;font-weight:900;font-size:150px;line-height:1">${d.val}<span style="font-size:70px"> ${d.per}</span></div>
          <div id="line" style="position:absolute;left:-20px;top:46%;height:22px;background:#ff2b2b;border:5px solid #111;border-radius:12px;transform:rotate(-7deg);transform-origin:left center"></div>
        </div>
        <div class="stk ylw" id="calc" style="--sw:11px;font-weight:900;font-size:64px;margin-top:26px">${d.calcPre} <span id="cnt">0</span> ${d.calcUnit}</div>
        <div class="pill" id="stamp" style="margin-top:40px;background:#ffd400;color:#111;font-size:82px;padding:10px 40px">${d.stamp}</div>
      </div>`;
    },
    seek(t) {
      setDim(t, 0.5);
      const $ = (id) => document.getElementById(id), d = S.data;
      const a = outBack(lin(t, 0, 0.3));
      $('lab').style.transform = `rotate(-3deg) scale(${a})`;
      $('valbox').style.transform = `scale(${outBack(lin(t, 0.08, 0.38))})`;
      const w = $('valbox').offsetWidth + 40;
      $('line').style.width = `${w * outCubic(lin(t, d.strikeAt, d.strikeAt + 0.3))}px`;
      const c = lin(t, d.countAt, d.countAt + 0.9);
      $('calc').style.opacity = clamp(c * 5);
      $('cnt').textContent = fmt(Math.round(d.count * outCubic(c)));
      const s = outBack(lin(t, d.stampAt, d.stampAt + 0.3));
      $('stamp').style.transform = `rotate(-7deg) scale(${s < 1 ? 2 - s : 1})`;
      $('stamp').style.opacity = clamp(lin(t, d.stampAt, d.stampAt + 0.08));
      const e = exitK(t);
      $('grp').style.transform = `translateY(${-120 * (1 - e)}px) scale(${0.7 + 0.3 * e})`; $('grp').style.opacity = e;
    },
  },
  stack: {  // MG3: chồng thẻ quyền lợi
    build(d) {
      const cp = d.compact ? 'height:92px;margin-bottom:12px;' : 'margin-bottom:16px;';
      const cards = d.items.map((it, i) => `<div class="card${d.compact ? ' cmp' : ''}" id="c${i}" style="${cp}background:${i % 2 ? '#fff' : '#ffd400'}">
          <div class="ic"><svg><use href="#${it.icon}"/></svg></div><div><b>${it.title}</b><span>${it.sub}</span></div>
          <div class="ok" id="k${i}"><svg><use href="#check"/></svg></div></div>`).join('');
      return `<div class="dim"></div><div class="abs" id="grp" style="left:56px;width:870px;top:${d.top || 470}px">
        <div class="pill" id="head" style="background:#ff2b2b;color:#fff;font-size:54px;padding:6px 28px;margin-bottom:24px">${d.head}</div>${cards}</div>`;
    },
    seek(t) {
      setDim(t, S.data.compact ? 0.25 : 0.5);
      const $ = (id) => document.getElementById(id);
      const h = outBack(lin(t, 0, 0.3));
      $('head').style.transform = `rotate(-3deg) scale(${h})`;
      S.data.items.forEach((it, i) => {
        const k = outBack(lin(t, it.at, it.at + 0.32));
        const rot = i % 2 ? 1.2 : -1.4;
        $('c' + i).style.transform = `translateX(${700 * (1 - k)}px) rotate(${rot + 8 * (1 - k)}deg)`;
        $('c' + i).style.opacity = clamp(lin(t, it.at, it.at + 0.1));
        const ok = outBack(lin(t, it.at + 0.25, it.at + 0.45));
        $('k' + i).style.transform = `scale(${ok})`;
      });
      const e = exitK(t);
      $('grp').style.transform = `translateX(${-200 * (1 - e)}px)`; $('grp').style.opacity = e;
    },
  },
  math: {  // MG4: phép chia ra mỗi tháng/ngày
    build(d) {
      return `<div class="dim"></div><div class="abs" id="grp" style="left:60px;width:880px;top:560px;text-align:center">
        <div class="stk wht" id="expr" style="--sw:16px;font-weight:900;font-size:130px">${d.expr}</div>
        <div class="stk ylw" id="res" style="--sw:22px;font-weight:900;font-size:210px;line-height:1;filter:drop-shadow(10px 12px 0 #111)">≈ <span id="cnt">0</span></div>
        <div class="pill" id="unit" style="background:#fff;color:#111;font-size:62px;padding:6px 32px;margin-top:18px">${d.unit}</div>
        <div class="emoji abs" id="emo" style="font-size:170px;right:-30px;top:-190px">${d.emoji}</div></div>`;
    },
    seek(t) {
      setDim(t, 0.5);
      const $ = (id) => document.getElementById(id), d = S.data;
      $('expr').style.transform = `rotate(-4deg) scale(${outBack(lin(t, 0, 0.3))})`;
      const c = lin(t, 0.35, 1.1);
      $('res').style.opacity = clamp(c * 6);
      $('res').style.transform = `rotate(-4deg) scale(${0.6 + 0.4 * outBack(c * 2)})`;
      $('cnt').textContent = fmt(d.value * outCubic(c), d.dec);
      $('unit').style.transform = `rotate(3deg) scale(${outBack(lin(t, 0.9, 1.2))})`;
      const em = outBack(lin(t, 1.0, 1.3));
      $('emo').style.transform = `rotate(${12 + Math.sin(t * 9) * 8}deg) scale(${em})`;
      const e = exitK(t);
      $('grp').style.transform = `scale(${0.7 + 0.3 * e})`; $('grp').style.opacity = e;
    },
  },
  choice: {  // MG5: hai lựa chọn bảo hành
    build(d) {
      const card = (o, id, bg) => `<div class="card" id="${id}" style="height:170px;background:${bg};justify-content:space-between;padding:0 34px;margin-bottom:30px">
          <div style="flex:1"><b style="font-size:42px">${o.label}</b><span style="font-size:30px">${o.note}</span></div>
          <div class="stk ylw" style="--sw:12px;font-weight:900;font-size:84px;white-space:nowrap">${o.val}</div></div>`;
      return `<div class="dim"></div><div class="abs" id="grp" style="left:70px;width:850px;top:520px">
        <div class="pill" id="head" style="background:#fff;color:#111;font-size:50px;padding:6px 28px;margin-bottom:30px">${d.head}</div>
        ${card(d.a, 'ca', '#fff')}${card(d.b, 'cb', '#fff')}
        <div class="emoji abs" id="hand" style="font-size:110px;left:-104px">👉</div></div>`;
    },
    seek(t) {
      setDim(t, 0.5);
      const $ = (id) => document.getElementById(id), d = S.data;
      $('head').style.transform = `rotate(-3deg) scale(${outBack(lin(t, 0, 0.3))})`;
      ['ca', 'cb'].forEach((id, i) => {
        const k = outBack(lin(t, 0.12 + i * 0.15, 0.45 + i * 0.15));
        const on = (i === 0 && t < d.switchAt) || (i === 1 && t >= d.switchAt);
        $(id).style.transform = `translateX(${600 * (1 - k)}px) rotate(${i ? 1.5 : -1.5}deg) scale(${on ? 1.04 : 0.96})`;
        $(id).style.opacity = clamp(lin(t, 0.12 + i * 0.15, 0.25 + i * 0.15)) * (on ? 1 : 0.8);
        $(id).style.background = on ? '#ffd400' : '#fff';
      });
      const y = t < d.switchAt ? 0 : 200 * outCubic(lin(t, d.switchAt, d.switchAt + 0.3));
      $('hand').style.top = `${130 + y}px`;
      $('hand').style.transform = `translateX(${Math.sin(t * 10) * 10}px) scale(${outBack(lin(t, 0.5, 0.8))})`;
      const e = exitK(t);
      $('grp').style.transform = `scale(${0.7 + 0.3 * e})`; $('grp').style.opacity = e;
    },
  },
  end: {  // MG7: thẻ CTA cuối
    build(d) {
      return `<div class="dim" style="height:1100px"></div><div class="abs" id="grp" style="left:60px;width:880px;top:440px;text-align:center">
        <div class="stk ylw" id="big" style="--sw:20px;font-weight:900;font-size:124px;line-height:1.02;filter:drop-shadow(9px 11px 0 #111)">${d.big}</div>
        <div class="stk wht" id="lead" style="--sw:10px;font-weight:800;font-size:50px;margin-top:16px">${d.lead}</div>
        <div class="card" id="p1" style="height:150px;margin-top:40px;gap:26px;padding:0 30px"><div class="ic" style="width:96px;height:96px;border-radius:50%;background:#ff2b2b"><svg style="stroke:#fff;width:56px;height:56px"><use href="#globe"/></svg></div>
          <div style="text-align:left"><b style="font-size:58px" id="url"></b><span>${d.urlNote}</span></div></div>
        <div class="stk wht" id="or" style="--sw:9px;font-weight:800;font-size:42px;margin-top:28px">${d.or}</div>
        <div class="card" id="p2" style="height:150px;margin-top:22px;gap:26px;padding:0 30px;background:#ffd400"><div class="ic" style="width:96px;height:96px;border-radius:50%;background:${d.botIcon ? '#111' : '#29a9eb'}"><svg style="fill:${d.botIcon ? '#ffd400' : '#fff'};width:56px;height:56px"><use href="#${d.botIcon || 'plane'}"/></svg></div>
          <div style="text-align:left"><b style="font-size:58px">${d.bot}</b><span>${d.botNote}</span></div></div>
        <div class="emoji" id="fing" style="font-size:120px;margin-top:20px">👆</div></div>`;
    },
    seek(t) {
      S.dim.style.opacity = 0.55 * outCubic(lin(t, 0, 0.2));
      const $ = (id) => document.getElementById(id), d = S.data;
      const b = outBack(lin(t, 0, 0.32));
      $('big').style.transform = `rotate(-4deg) scale(${b})`;
      $('lead').style.opacity = outCubic(lin(t, 0.25, 0.45));
      const p1 = outBack(lin(t, 0.3, 0.6)), p2 = outBack(lin(t, 0.55, 0.85));
      $('p1').style.transform = `translateX(${-700 * (1 - p1)}px) rotate(-1.5deg)`;
      $('p2').style.transform = `translateX(${700 * (1 - p2)}px) rotate(1.5deg)`;
      $('or').style.opacity = outCubic(lin(t, 0.5, 0.7));
      const n = Math.round(d.url.length * lin(t, 0.45, 1.1));
      $('url').textContent = d.url.slice(0, n) + (t < 1.1 && Math.floor(t * 6) % 2 ? '|' : '');
      $('fing').style.transform = `translateY(${Math.abs(Math.sin(t * 5)) * -26}px) scale(${outBack(lin(t, 0.9, 1.2))})`;
      const pulse = 1 + 0.035 * Math.sin(t * 6);
      $('p2').style.transform += ` scale(${t > 1 ? pulse : 1})`;
    },
  },
};

window.setup = (cfg) => {
  S = { ...cfg };
  const root = document.getElementById('root');
  root.innerHTML = TYPES[cfg.type].build(cfg.data);
  S.dim = root.querySelector('.dim');
  return document.fonts.ready.then(() => true);
};
window.seek = (t) => { TYPES[S.type].seek(t); return true; };
</script>
</body>
</html>
