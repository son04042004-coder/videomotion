<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@800;900&display=block" rel="stylesheet">
<style>
  /* Motion graphic KÊNH 2 "Sticker dán" (chồng iu chốt 30/10, mẫu C): cùng họ sticker bựa của kênh 1 nhưng mọi thứ là sticker
     cắt viền trắng dày (die-cut) dán lên màn hình — bóc–dán xoay nghiêng, băng keo washi, emoji sticker bay; cam–xanh dương–xanh lá.
     Cùng API/dữ liệu với anim.html: window.setup({type, dur, data}) rồi window.seek(t). Vùng an toàn x 60–940, y 150–1450. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: 'Baloo 2', sans-serif; }
  .abs { position: absolute; }
  .dim { position: absolute; left: 0; right: 0; top: 392px; height: 1000px; background: #0a1a3a; opacity: 0; }
  .die { filter: drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 14px 16px rgba(0,0,0,.45)); }
  .chip { display: inline-block; border-radius: 26px; font-weight: 800; color: #fff; padding: 2px 34px 8px; }
  .or { background: #ff6a00; } .bl { background: #2f6bff; } .gr { background: #00b86b; } .wh { background: #fff; color: #10204a; } .yl { background: #ffd23f; color: #10204a; } .pk { background: #ff4f8b; }
  .big { font-family: 'Be Vietnam Pro'; font-weight: 900; -webkit-text-stroke: var(--sw, 14px) #10204a; paint-order: stroke fill; }
  .tape { position: absolute; width: 150px; height: 46px; background: repeating-linear-gradient(45deg, rgba(255,240,180,.92) 0 14px, rgba(255,210,120,.92) 14px 28px); }
  .row { position: relative; display: flex; align-items: center; gap: 20px; height: 108px; padding: 0 28px; border-radius: 28px; color: #fff; }
  .row .e { font-family: 'Segoe UI Emoji'; font-size: 56px; flex: none; }
  .row b { display: block; font-weight: 800; font-size: 44px; line-height: 1; }
  .row span { display: block; font-weight: 700; font-size: 27px; opacity: .92; }
  .cmp .row { height: 92px; } .cmp .row b { font-size: 38px; } .cmp .row span { font-size: 24px; } .cmp .row .e { font-size: 48px; }
  .emoji, .fly { font-family: 'Segoe UI Emoji'; }
  .fly { position: absolute; font-size: 104px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const clamp = (x) => Math.max(0, Math.min(1, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const outBack = (x) => { const c1 = 1.8, c3 = c1 + 1; x = clamp(x); return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inCubic = (x) => Math.pow(clamp(x), 3);
const fmt = (v, dec = 0) => v.toLocaleString('vi-VN', { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: false });   // 1850, không "1.850" (dễ bị đọc thành tiền)
const $ = (id) => document.getElementById(id);
let S = null;
const EMO = { bolt: '⚡', code: '💻', spark: '✨', check: '✅', search: '🔎', film: '🎬', globe: '🌐', book: '📘', user: '🙋', cloud: '☁️', mail: '💌', chart: '📈', image: '🖼️', plane: '✈️' };
const exitK = (t) => 1 - inCubic(lin(t, S.dur - 0.25, S.dur));
function setDim(t, max = 0.45) { S.dim.style.opacity = max * outCubic(lin(t, 0, 0.18)) * exitK(t); }
// số chạy: "180" → 0…180, giữ tiền tố/hậu tố ("-53%"); chữ không phải số thì hiện thẳng
const roll = (str, k) => { const m = String(str).match(/^(\D*)([\d.,]+)(.*)$/); return m ? m[1] + fmt(parseFloat(m[2].replace(/\./g, '').replace(',', '.')) * outCubic(k), m[2].includes(',') ? 1 : 0) + m[3] : str; };
// dán sticker: rơi xuống, lật quanh trục X như vừa bóc ra rồi ép xuống, dừng ở góc nghiêng `rot`
function stick(node, t, a, rot, extra = '') { const k = lin(t, a, a + 0.38), b = outBack(k);
  node.style.transform = `perspective(900px) translateY(${-90 * (1 - b)}px) rotateX(${55 * (1 - outCubic(k))}deg) rotate(${rot + 10 * (1 - b)}deg) scale(${0.5 + 0.5 * b}) ${extra}`; node.style.opacity = clamp(k * 5); }
function exitAll(t) { const e = exitK(t); $('grp').style.opacity = e; $('grp').style.transform = `translateY(${(1 - e) * -160}px) rotate(${(1 - e) * 8}deg)`; }
// emoji sticker bay quanh khung (mỗi loại thẻ một bộ)
let FLY = [];
const flies = (set) => { FLY = set; return set.map((f, i) => `<div class="fly die" id="fl${i}" style="left:${f[1]}px;top:${f[2]}px">${f[0]}</div>`).join(''); };
function flySeek(t) { FLY.forEach((f, i) => { const k = lin(t, 0.5 + i * 0.12, 0.8 + i * 0.12); $('fl' + i).style.transform = `rotate(${(i % 2 ? 14 : -14) + Math.sin(t * 4 + i) * 8}deg) scale(${outBack(k)})`; $('fl' + i).style.opacity = exitK(t); }); }

const TYPES = {
  slam: {  // con số chính
    build(d) {
      return `<div class="dim"></div>${flies([['🔥', 70, 470], ['⭐', 880, 600], ['😎', 80, 1170], ['💯', 860, 1190]])}<div class="abs" id="grp" style="left:60px;width:880px;top:520px;text-align:center">
        <div class="die" id="tag" style="display:inline-block;position:relative"><div class="chip or" style="font-size:56px">${d.tag}</div><div class="tape" style="left:-50px;top:-18px;transform:rotate(-30deg)"></div></div><br>
        <div class="die" id="prod" style="display:inline-block;margin-top:26px"><div class="chip bl" style="font-size:52px">${d.prod}</div></div>
        <div class="die big" id="numw" style="margin-top:14px;font-size:${d.num.length >= 4 ? 220 : 270}px;line-height:1;letter-spacing:-6px;color:#ffd23f"><span id="num">${d.num}</span><span style="font-size:110px;letter-spacing:0;margin-left:14px;color:#fff">${d.unit}</span></div>
        <div class="die" id="sub" style="display:inline-block;margin-top:16px"><div class="chip gr" style="font-size:42px">${d.sub}</div></div></div>`;
    },
    seek(t) {
      setDim(t); flySeek(t);
      stick($('tag'), t, 0, -5); stick($('prod'), t, 0.12, 3); stick($('numw'), t, 0.24, -4); stick($('sub'), t, 0.6, 2);
      $('num').textContent = roll(S.data.num, lin(t, 0.24, 0.8));
      exitAll(t);
    },
  },
  strike: {  // phí trên trang chính bị gạch + bộ đếm + tem "bên em"
    build(d) {
      return `<div class="dim"></div>${flies([['😱', 70, 500], ['👀', 870, 640]])}<div class="abs" id="grp" style="left:70px;width:860px;top:500px;text-align:center">
        <div class="die" id="lab" style="display:inline-block"><div class="chip wh" style="font-size:46px">${d.label}</div></div><br>
        <div id="valbox" style="position:relative;display:inline-block;margin-top:26px">
          <div class="die big" style="--sw:12px;font-size:140px;line-height:1;color:#fff">${d.val}<span style="font-size:62px"> ${d.per}</span></div>
          <div id="line" style="position:absolute;left:-24px;top:44%;height:26px;border-radius:14px;background:#ff3b3b;border:5px solid #fff;box-shadow:0 6px 12px rgba(0,0,0,.4);transform:rotate(-7deg);transform-origin:left center"></div></div>
        <div class="die" id="calc" style="margin-top:24px"><div class="chip bl" style="font-size:52px">${d.calcPre} <span id="cnt">0</span> ${d.calcUnit}</div></div>
        <div class="die" id="stamp" style="display:inline-block;position:relative;margin-top:34px"><div class="chip or" style="font-size:80px;padding:4px 44px 12px">${d.stamp}</div>
          <div class="tape" style="right:-46px;top:-16px;transform:rotate(28deg)"></div></div></div>`;
    },
    seek(t) {
      setDim(t, 0.5); flySeek(t); const d = S.data;
      stick($('lab'), t, 0, -3); stick($('valbox'), t, 0.1, 0);
      $('line').style.width = `${($('valbox').offsetWidth + 48) * outCubic(lin(t, d.strikeAt, d.strikeAt + 0.3))}px`;
      const c = lin(t, d.countAt, d.countAt + 0.9); stick($('calc'), t, d.countAt, 2);
      $('cnt').textContent = fmt(Math.round(d.count * outCubic(c)));
      stick($('stamp'), t, d.stampAt, -5);
      exitAll(t);
    },
  },
  stack: {  // chồng sticker quyền lợi
    build(d) {
      const cls = ['or', 'bl', 'gr', 'yl'];
      const rows = d.items.map((it, i) => `<div class="die" id="c${i}" style="margin-bottom:${d.compact ? 20 : 26}px"><div class="row ${cls[i % 4]}" style="${cls[i % 4] === 'yl' ? 'color:#10204a' : ''}"><div class="e">${EMO[it.icon] || '⭐'}</div><div><b>${it.title}</b><span>${it.sub}</span></div>
        ${i === 0 ? '<div class="tape" style="right:-40px;top:-20px;transform:rotate(28deg)"></div>' : ''}</div></div>`).join('');
      return `<div class="dim"></div><div class="abs${d.compact ? ' cmp' : ''}" id="grp" style="left:70px;width:850px;top:${d.top || 470}px">
        <div class="die" id="head" style="display:inline-block;margin-bottom:26px"><div class="chip wh" style="font-size:48px">${d.head}</div></div>${rows}</div>`;
    },
    seek(t) {
      setDim(t, S.data.compact ? 0.25 : 0.45);
      stick($('head'), t, 0, -3); S.data.items.forEach((it, i) => stick($('c' + i), t, it.at, i % 2 ? 1.6 : -1.6));
      exitAll(t);
    },
  },
  math: {  // phép chia ra mỗi tháng/ngày
    build(d) {
      return `<div class="dim"></div>${flies([['🤑', 820, 470], ['🧮', 90, 1080]])}<div class="abs" id="grp" style="left:60px;width:880px;top:560px;text-align:center">
        <div class="die" id="expr" style="display:inline-block"><div class="chip bl" style="font-size:96px;padding:0 44px 10px">${d.expr}</div></div>
        <div class="die big" id="res" style="font-size:210px;line-height:1.05;color:#ffd23f;margin-top:16px">≈ <span id="cnt">0</span></div>
        <div class="die" id="unit" style="display:inline-block;position:relative;margin-top:18px"><div class="chip gr" style="font-size:60px">${d.unit}</div><div class="tape" style="left:-44px;top:-16px;transform:rotate(-26deg)"></div></div></div>`;
    },
    seek(t) {
      setDim(t, 0.5); flySeek(t); const d = S.data;
      stick($('expr'), t, 0, -3); stick($('res'), t, 0.35, -4); stick($('unit'), t, 0.9, 3);
      $('cnt').textContent = fmt(d.value * outCubic(lin(t, 0.35, 1.1)), d.dec);
      exitAll(t);
    },
  },
  choice: {  // hai lựa chọn: sticker đang được nói tới phóng to + đổi màu, ngón tay trượt theo
    build(d) {
      const card = (o, id) => `<div class="die" id="${id}" style="margin-bottom:30px"><div class="row" id="${id}r" style="height:168px;justify-content:space-between;padding:0 36px">
          <div style="flex:1"><b style="font-size:42px">${o.label}</b><span style="font-size:28px">${o.note}</span></div>
          <div class="big" style="--sw:10px;font-size:82px;white-space:nowrap;color:#fff">${o.val}</div></div></div>`;
      return `<div class="dim"></div><div class="abs" id="grp" style="left:90px;width:830px;top:520px">
        <div class="die" id="head" style="display:inline-block;margin-bottom:30px"><div class="chip wh" style="font-size:48px">${d.head}</div></div>
        ${card(d.a, 'ca')}${card(d.b, 'cb')}
        <div class="emoji abs die" id="hand" style="font-size:96px;left:-84px">👉</div></div>`;
    },
    seek(t) {
      setDim(t, 0.5); const d = S.data;
      stick($('head'), t, 0, -3);
      ['ca', 'cb'].forEach((id, i) => {
        const on = (i === 0 && t < d.switchAt) || (i === 1 && t >= d.switchAt);
        stick($(id), t, 0.12 + i * 0.15, i ? 1.5 : -1.5, `scale(${on ? 1.04 : 0.94})`);
        $(id).style.opacity = clamp(lin(t, 0.12 + i * 0.15, 0.2 + i * 0.15)) * (on ? 1 : 0.75);
        $(id + 'r').style.background = on ? (i ? '#ff6a00' : '#2f6bff') : '#7b8db8';
      });
      const y = t < d.switchAt ? 0 : 198 * outCubic(lin(t, d.switchAt, d.switchAt + 0.3));
      $('hand').style.top = `${130 + y}px`;
      $('hand').style.transform = `translateX(${Math.sin(t * 10) * 10}px) scale(${outBack(lin(t, 0.5, 0.8))})`;
      exitAll(t);
    },
  },
  end: {  // CTA cuối
    build(d) {
      return `<div class="dim" style="height:1100px"></div>${flies([['🔥', 70, 470], ['⭐', 880, 600], ['😎', 80, 1170], ['💯', 860, 1190]])}<div class="abs" id="grp" style="left:60px;width:880px;top:440px;text-align:center">
        <div class="die big" id="big" style="--sw:12px;font-size:124px;line-height:1.02;color:#ff6a00">${d.big}</div>
        <div class="die" id="lead" style="display:inline-block;margin-top:16px"><div class="chip wh" style="font-size:40px">${d.lead}</div></div>
        <div class="die" id="p1" style="margin-top:34px"><div class="row bl" style="height:146px;text-align:left"><div class="e" style="font-size:72px">🌐</div><div><b style="font-size:54px" id="url"></b><span>${d.urlNote}</span></div>
          <div class="tape" style="left:-40px;top:-18px;transform:rotate(-24deg)"></div></div></div>
        <div class="die" id="or" style="display:inline-block;margin-top:26px"><div class="chip yl" style="font-size:36px">${d.or}</div></div>
        <div class="die" id="p2" style="margin-top:26px"><div class="row or" style="height:146px;text-align:left"><div class="e" style="font-size:72px">✈️</div><div><b style="font-size:54px">${d.bot}</b><span>${d.botNote}</span></div></div></div>
        <div class="emoji" id="fing" style="font-size:110px">👆</div></div>`;
    },
    seek(t) {
      S.dim.style.opacity = 0.55 * outCubic(lin(t, 0, 0.2)); flySeek(t); const d = S.data;
      stick($('big'), t, 0, -4); stick($('lead'), t, 0.25, 2); stick($('p1'), t, 0.38, -1.5); stick($('or'), t, 0.55, 3);
      stick($('p2'), t, 0.65, 1.5, t > 1.1 ? `scale(${1 + 0.035 * Math.sin(t * 7)})` : '');
      $('url').textContent = d.url.slice(0, Math.round(d.url.length * lin(t, 0.5, 1.1)));
      $('fing').style.transform = `translateY(${-Math.abs(Math.sin(t * 5)) * 24}px) scale(${outBack(lin(t, 0.9, 1.2))})`;
    },
  },
};
// ===== Thẻ học từ video-shotcraft (Apache-2.0, viết lại theo công thức trong references/shots, kiểu sticker dán, khung dọc 9:16) =====
const outQuint = (x) => 1 - Math.pow(1 - clamp(x), 5);
const spring = (x, damp = 13) => { x = Math.max(0, x); return 1 - Math.exp(-damp * 0.55 * x) * Math.cos(x * 16); };   // lò xo có 1 lần vượt
const inQuad = (x) => clamp(x) * clamp(x);
const swift = (x) => { x = clamp(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
// gạch chân bút dạ: path SVG rộng giữa, nhỏ 2 đầu, hơi dốc lên (trái thấp phải cao)
const marker = (id, w) => `<svg id="${id}" class="abs" style="left:-6px;bottom:-14px;width:${w + 12}px;height:30px;overflow:visible" viewBox="0 0 ${w + 12} 30">
  <path d="M4 22 Q ${(w + 12) * 0.5} 12 ${w + 8} 8" fill="none" stroke="#ff6a00" stroke-width="13" stroke-linecap="round" opacity=".92" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>`;
const markerSeek = (id, t, a) => { const p = document.querySelector(`#${id} path`); if (p) p.style.strokeDashoffset = 100 * (1 - outCubic(lin(t, a, a + 0.33))); };
const shake = (t, a, amp = 18, tau = 0.06, dur = 0.2) => (t > a && t < a + dur ? amp * Math.exp(-(t - a) / tau) * Math.sin((t - a) * 120) : 0);

Object.assign(TYPES, {
  pricecard: {  // product-card-progressive-assemble: thẻ sản phẩm tự điền từng ô, phí cũ bị gạch rồi mức mới bật ra
    build(d) {
      return `<div class="dim"></div><div class="abs" id="grp" style="left:70px;width:850px;top:${d.top || 470}px">
        <div class="die" id="card" style="background:#fff;border-radius:34px;padding:34px 36px 30px;position:relative">
          <div style="display:flex;align-items:center;gap:22px">
            <div class="f" id="f0" style="width:110px;height:110px;border-radius:28px;background:#10204a;display:grid;place-items:center;font-family:'Segoe UI Emoji';font-size:64px">${d.icon || '🤖'}</div>
            <div class="f" id="f1" style="font-family:'Be Vietnam Pro';font-weight:900;font-size:54px;line-height:1.05;color:#10204a">${d.title}</div></div>
          <div style="display:flex;gap:12px;margin-top:20px">${(d.tags || []).map((g, i) => `<div class="f chip ${['bl', 'gr', 'pk'][i % 3]}" id="g${i}" style="font-size:30px;padding:0 22px 4px">${g}</div>`).join('')}</div>
          <div id="prow" style="margin-top:22px;height:124px;position:relative">
            <div class="f" id="old" style="font-family:'Be Vietnam Pro';font-weight:900;font-size:96px;line-height:1;color:#10204a;transform-origin:left bottom;position:absolute;left:0;bottom:0;white-space:nowrap">${d.old}<div id="oldline" style="position:absolute;left:-6px;top:52%;height:10px;border-radius:5px;background:#ff3b3b;width:0"></div></div>
            <div class="f" id="new" style="position:absolute;bottom:-6px;line-height:1;font-family:'Be Vietnam Pro';font-weight:900;font-size:112px;color:#ff6a00;-webkit-text-stroke:8px #10204a;paint-order:stroke fill;white-space:nowrap;transform-origin:left bottom">${d.new}</div>
            <div class="f chip or" id="chipx" style="position:absolute;bottom:14px;white-space:nowrap;font-size:30px;padding:0 20px 4px">${d.chip || ''}</div></div>
          ${(d.lines || []).map((l, i) => `<div class="f" id="l${i}" style="position:relative;font-weight:700;font-size:34px;color:#10204a;margin-top:${i ? 6 : 16}px;white-space:nowrap">
              <span id="h${i}" style="position:absolute;left:-6px;right:-6px;top:6px;bottom:2px;background:rgba(255,210,63,.65);border-radius:8px;transform-origin:left;transform:scaleX(0)"></span><span style="position:relative">✓ ${l}</span></div>`).join('')}
          <div class="f" id="btn" style="margin-top:22px;height:86px;border-radius:24px;background:#dfe6f5;position:relative;overflow:hidden;display:grid;place-items:center">
            <div id="btnfill" style="position:absolute;inset:0;background:#ff6a00;transform-origin:left;transform:scaleX(0)"></div>
            <b id="btntx" style="position:relative;font-weight:800;font-size:40px;color:#fff;opacity:0">${d.button || 'NHẤC NGAY'}</b></div>
          <div id="cur" class="abs" style="border:4px solid #2f6bff;border-radius:18px;box-shadow:0 0 0 6px rgba(47,107,255,.18);pointer-events:none">
            <div style="position:absolute;top:-30px;left:-4px;background:#2f6bff;color:#fff;font-weight:800;font-size:18px;padding:0 10px 2px;border-radius:8px">TỰ ĐIỀN</div></div>
        </div></div>`;
    },
    layout() {   // đo hộp từng ô (toạ độ trong thẻ) cho con trỏ tự điền
      const card = $('card').getBoundingClientRect();
      const box = (id) => { const r = $(id).getBoundingClientRect(); return [r.left - card.left - 8, r.top - card.top - 8, r.width + 16, r.height + 16]; };
      const n = (S.data.lines || []).length, g = (S.data.tags || []).length;
      // lịch: [ô, giây con trỏ tới] — cùng nhóm cách 0,1s, khác nhóm 0,33–0,66s (công thức 8/20/30/42/76/96/114 khung)
      S.plan = [['f0', 0.27], ['f1', 0.67], ...Array.from({ length: g }, (_, i) => [`g${i}`, 1.0 + i * 0.1]), ['old', 1.4],
        ...Array.from({ length: n }, (_, i) => [`l${i}`, 2.55 + i * 0.12]), ['btn', 3.0 + n * 0.12]];
      S.boxes = S.plan.map(([id]) => box(id));
    },
    seek(t) {
      setDim(t, 0.5); const d = S.data;
      const c = outCubic(lin(t, 0, 0.45));
      $('card').style.transform = `translateY(${30 * (1 - c)}px) scale(${(0.96 + 0.04 * c) * (1 + 0.035 * swift(t / Math.max(1, S.dur - 1)))})`;
      $('card').style.opacity = clamp(t * 6);
      S.plan.forEach(([id, at], i) => {
        const el = $(id), k = lin(t, at + 0.07, at + 0.53);
        if (id.startsWith('g')) { el.style.transform = `scale(${0.4 + 0.6 * spring(t - at - 0.07)})`; el.style.opacity = clamp((t - at - 0.07) * 8); }

      $('wf').style.opacity = rk > 0 && rk < 0.07 ? 0.55 : 0;
    }
    if (d.fx === 'riso') {   // tách 2 bản in hồng/xanh lệch nhau, rung tắt dần rồi "tách" khớp lại một phát
      const hit = 0.45, rk = t - hit, snap = 1.4;
      const on = rk > 0 && t < snap, A = on ? Math.cos(2 * Math.PI * rk / 0.6) * Math.exp(-rk / 2) : 0;
      const sh = on ? `${20 * A}px ${8 * A}px 0 rgba(255,79,163,.85), ${-20 * A}px ${-8 * A}px 0 rgba(31,95,196,.85)` : '';
      $('num').style.textShadow = sh;
      if (t >= snap && t < snap + 0.13) nw.style.transform += ` scale(${1.03 - 0.03 * (t - snap) / 0.13})`;
    }
  },
};

window.setup = (cfg) => { S = { ...cfg }; $('root').innerHTML = TYPES[cfg.type].build(cfg.data); S.dim = $('root').querySelector('.dim'); return document.fonts.ready.then(() => { TYPES[cfg.type].layout?.(); return true; }); };
window.seek = (t) => { TYPES[S.type].seek(t); return true; };
</script>
